<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>카드뉴스 08</title><link rel="stylesheet" href="card.css"></head><body><div class="card card8">
<style>
.check { flex:none; width:68px; height:68px; border-radius:50%; background:#131313; display:grid; place-items:center; }
.check svg { width:38px; height:38px; }
.card8 .list li { font-size:40px; gap:28px; }
.btn { margin-top:44px; border:2.5px solid var(--ink); border-radius:999px; padding:18px 56px; font-size:32px; font-weight:700; }
.card8 .lower { bottom:130px; }
</style>
<div class="panel">
  <div class="panel-title">오늘 정리</div>
  <ul class="list">
    <li><span class="check"><svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 21 L17 28 L30 13"/></svg></span>한 번에 시키지 말고 단계를 나눈다</li>
    <li><span class="check"><svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 21 L17 28 L30 13"/></svg></span>내 데이터를 먼저 넣는다</li>
    <li><span class="check"><svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 21 L17 28 L30 13"/></svg></span>원고 하나로 채널을 돌린다</li>
  </ul>
</div>
<div class="lower">
  <div class="title">오늘부터<br><span class="hl">한 단계씩 해 보세요</span></div>
  <div class="body">저장해두고 강의 준비할 때 다시 보세요.</div>
  <div class="btn">저장하기</div>
</div>
<div class="foot">강의 만들기 키트</div></div><script src="check.js"></script></body></html>
