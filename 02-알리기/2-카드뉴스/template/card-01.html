<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>카드뉴스 01</title><link rel="stylesheet" href="card.css"></head><body><div class="card card1">
<style>
.hero { position:absolute; left:88px; right:88px; top:110px; height:600px; }
.bubble { position:absolute; left:0; top:0; padding:34px 52px; border:3px solid var(--ink); border-radius:44px; font-size:50px; font-weight:700; letter-spacing:-0.03em; white-space:nowrap; }
.bubble::after { content:""; position:absolute; left:70px; bottom:-26px; width:40px; height:40px; background:var(--bg); border-right:3px solid var(--ink); border-bottom:3px solid var(--ink); transform:rotate(45deg) skew(8deg,8deg); }
.arrow { position:absolute; left:120px; top:170px; }
.toc { position:absolute; left:250px; top:250px; width:620px; height:330px; border-radius:28px; background:#E9E4D8; padding:48px 52px; filter:blur(3px); opacity:.85; }
.toc i { display:block; height:22px; border-radius:11px; background:#C9C3B6; margin-bottom:30px; }
.tag { display:inline-block; border:2px solid var(--ink); border-radius:999px; padding:12px 28px; font-size:28px; font-weight:600; margin-bottom:36px; }
.card1 .title { font-size:92px; }
.card1 .lower { bottom:170px; }
</style>
<div class="hero">
  <div class="bubble">강의 만들어줘</div>
  <svg class="arrow" width="140" height="150" viewBox="0 0 140 150" fill="none" stroke="#131313" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10 C 20 90, 60 120, 120 120"/><path d="M100 100 L122 120 L100 140"/></svg>
  <div class="toc"><i style="width:55%"></i><i style="width:88%"></i><i style="width:72%"></i><i style="width:80%"></i><i style="width:46%"></i></div>
</div>
<div class="lower">
  <div class="tag">강사님을 위한 강의 만들기</div>
  <div class="title">AI에게 한 번에 시키면<br><span class="hl">남의 강의가 나옵니다</span></div>
  <div class="body">강의 하나를 만들고, 그 강의를 알리기까지</div>
</div>
<div class="foot">강의 만들기 키트</div></div><script src="check.js"></script></body></html>
