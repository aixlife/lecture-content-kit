<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>카드뉴스 03</title><link rel="stylesheet" href="card.css"></head><body><div class="card">
<style>
.top { position:absolute; left:88px; right:88px; top:110px; }
.steps { position:absolute; left:88px; right:88px; top:470px; display:flex; flex-direction:column; align-items:flex-start; }
.step { width:660px; height:92px; border:2.5px solid var(--ink); border-radius:24px; display:flex; align-items:center; gap:26px; padding:0 32px; font-size:38px; font-weight:700; letter-spacing:-0.02em; white-space:nowrap; }
.step b { width:48px; height:48px; border-radius:50%; border:2px solid currentColor; display:grid; place-items:center; font-size:26px; font-weight:800; flex:none; }
.step.on { border-color:var(--accent); color:var(--accent); }
.down { width:660px; height:42px; display:flex; justify-content:center; align-items:center; }
</style>
<div class="top">

</div>

  <div class="down"><svg width="24" height="30" viewBox="0 0 24 30" fill="none" stroke="#8C8C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 V26 M4 18 L12 26 L20 18"/></svg></div>
  <div class="step on"><b>2</b>내 데이터</div>
  <div class="down"><svg width="24" height="30" viewBox="0 0 24 30" fill="none" stroke="#8C8C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 V26 M4 18 L12 26 L20 18"/></svg></div>
  <div class="step"><b>3</b>구조설계서</div>

  <div class="step"><b>4</b>덱</div>
  <div class="down"><svg width="24" height="30" viewBox="0 0 24 30" fill="none" stroke="#8C8C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 V26 M4 18 L12 26 L20 18"/></svg></div>

  <div class="down"><svg width="24" height="30" viewBox="0 0 24 30" fill="none" stroke="#8C8C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 V26 M4 18 L12 26 L20 18"/></svg></div>
